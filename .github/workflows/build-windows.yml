name: Build AyuGram Windows x64

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          sdk: 10.0.26100.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          choco install -y ninja

      - name: Prepare libraries
        run: |
          cd ${{ github.workspace }}
          Telegram\build\prepare\win.bat
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}\Libraries

      - name: Configure
        run: |
          cd ${{ github.workspace }}\Telegram
          configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Release
        run: |
          cd ${{ github.workspace }}
          cmake --build out --config Release --target Telegram -- /p:CL_MPCount=
        timeout-minutes: 120

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64-Release
          path: ${{ github.workspace }}\out\Release\AyuGram.exe
          if-no-files-found: warn

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64-Debug
          path: ${{ github.workspace }}\out\Debug\AyuGram.exe
          if-no-files-found: warn
